; GekyChat Laravel Reverb WebSocket Server – Supervisor config (netcup)
; App path: /var/www/chat.gekychat.com
; User: gekychat
; Nginx proxies /app and /apps to 127.0.0.1:8080

[program:gekychat-reverb]
process_name=%(program_name)s
command=php /var/www/chat.gekychat.com/artisan reverb:start --host=127.0.0.1 --port=8080
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=gekychat
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/chat.gekychat.com/storage/logs/reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600
