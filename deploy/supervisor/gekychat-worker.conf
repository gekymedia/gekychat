; GekyChat Laravel queue worker – Supervisor config (netcup)
; App path: /var/www/chat.gekychat.com
; User: gekychat

[program:gekychat-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/chat.gekychat.com/artisan queue:work --sleep=1 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=gekychat
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/chat.gekychat.com/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
