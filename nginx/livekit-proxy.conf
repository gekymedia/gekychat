# Nginx TLS reverse-proxy for LiveKit (netcup)
# Install: copy to /etc/nginx/sites-available/live.gekychat.com
#   ln -s ... /etc/nginx/sites-enabled/
#   certbot --nginx -d live.gekychat.com
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name live.gekychat.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name live.gekychat.com;

    # Certbot manages these on the VPS
    ssl_certificate     /etc/letsencrypt/live/live.gekychat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live.gekychat.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering    off;
        proxy_cache        off;
    }
}
