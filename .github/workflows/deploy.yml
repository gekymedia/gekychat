name: Deploy to VPS

# Deploys to production (netcup) when changes are pushed to main.
# Required GitHub secrets:
#   VPS_HOST       = 159.195.249.203
#   VPS_USERNAME   = root
#   VPS_SSH_KEY    = private key that can log in as root
#   DEPLOY_PATH    = /var/www/chat.gekychat.com
# SUDO_PASSWORD is optional on this host (root deploys directly).
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, gd, zip, redis, bcmath
        coverage: none

    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          set -e
          echo 'Starting deployment...'
          cd '${{ secrets.DEPLOY_PATH }}'

          echo 'Pulling latest code...'
          git fetch origin
          git reset --hard origin/main

          echo 'Installing Composer dependencies...'
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

          echo 'Running database migrations...'
          php artisan migrate --force

          echo 'Clearing caches...'
          php artisan optimize:clear

          echo 'Installing NPM dependencies and building assets...'
          npm ci --silent
          npm run build

          echo 'Optimizing...'
          php artisan optimize

          echo 'Linking storage...'
          php artisan storage:link || true

          echo 'Restarting queue workers...'
          php artisan queue:restart || true
          if command -v supervisorctl >/dev/null 2>&1; then
            supervisorctl reread || true
            supervisorctl update || true
          fi

          chown -R gekychat:gekychat storage bootstrap/cache public/downloads 2>/dev/null || true
          chmod -R ug+rwx storage bootstrap/cache

          echo 'Deployment completed successfully!'
